# version: "3.8"

services:
  taveuni_nextjs_prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      # target: production
    ports:
      - "8084:3000"
    depends_on:
      - db
    # command: ["/bin/sleep", "3600"]
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use internal Docker network
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
    restart: unless-stopped
    volumes:
      # make a volume for public folder to sync
      - /var/www/static/travel-blog:/app/public 
  db:
    image: postgres
    ports:
      - "5432:5432"
    container_name: travelblog_drizzle_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
volumes:
  pgdata:
  
